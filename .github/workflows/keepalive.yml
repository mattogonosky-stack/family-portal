name: Keep Supabase awake
on:
  schedule:
    - cron: "17 13 */3 * *"   # every 3 days, ~9 AM Eastern
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping family-portal
        run: |
          curl -fsS -X POST "https://tejgntbponstecmodian.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
